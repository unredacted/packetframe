version: 2

# SPEC.md §7.1 requires version drifts to surface as reviewable PRs
# rather than silent ecosystem movement. Dependabot covers all three
# package ecosystems in this repo: the workspace cargo graph, the
# non-workspace BPF cargo graph, and the github-actions used by CI.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The rust-netlink stack moves in lockstep: rtnetlink re-exports
      # netlink-packet-route types, so bumping either alone splits the
      # workspace into two incompatible copies of the crate and every
      # build job fails E0308 (PRs #194/#195). Group them at every
      # update-type so the bump always arrives as one mergeable PR.
      netlink:
        update-types: ["patch", "minor", "major"]
        patterns:
          - "rtnetlink"
          - "netlink-*"
      # Batch patch/minor ecosystem churn (serde, anyhow, clap etc.)
      # into one weekly PR. Major bumps land as individual PRs.
      userspace-minor:
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "aya*"
          - "rtnetlink"
          - "netlink-*"
    ignore:
      # aya stack is pinned tight per SPEC.md §7.1. Still gets updates
      # proposed — they just go through as individual PRs (no grouping).
      - dependency-name: "aya"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/crates/modules/fast-path/bpf"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types: ["patch", "minor", "major"]

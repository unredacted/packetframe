version: 2

# SPEC.md §7.1 requires version drifts to surface as reviewable PRs
# rather than silent ecosystem movement. Dependabot covers the workspace
# cargo graph, the non-workspace BPF cargo graphs, the stable Rust
# toolchain pin, and the github-actions used by CI.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The rust-netlink stack moves in lockstep: rtnetlink re-exports
      # netlink-packet-route types, so bumping either alone splits the
      # workspace into two incompatible copies of the crate and every
      # build job fails E0308 (PRs #194/#195). Group them at every
      # update-type so the bump always arrives as one mergeable PR.
      netlink:
        update-types: ["patch", "minor", "major"]
        patterns:
          - "rtnetlink"
          - "netlink-*"
      # Batch patch/minor ecosystem churn (serde, anyhow, clap etc.)
      # into one weekly PR. Major bumps land as individual PRs.
      userspace-minor:
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "aya*"
          - "rtnetlink"
          - "netlink-*"
    ignore:
      # aya stack is pinned tight per SPEC.md §7.1. Still gets updates
      # proposed — they just go through as individual PRs (no grouping).
      - dependency-name: "aya"
        update-types: ["version-update:semver-major"]

  # Each BPF crate is its own non-workspace cargo graph (own Cargo.lock,
  # own nightly rust-toolchain.toml), so the root entry never sees them.
  # They are listed explicitly rather than globbed so a new BPF crate is
  # a deliberate addition here, not a silent one.
  - package-ecosystem: "cargo"
    directories:
      - "/crates/modules/fast-path/bpf"
      - "/crates/modules/guard/bpf"
      - "/crates/modules/probe/bpf"
      - "/crates/modules/flow-export/bpf"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # All three BPF crates build on one nightly + bpf-linker pin, and
      # aya-ebpf is what that pin has to satisfy. group-by merges each aya
      # bump into one PR across every directory above, instead of one PR
      # per crate that could land with the others left behind.
      # network-types and anything else still go per crate.
      bpf-aya:
        group-by: dependency-name
        update-types: ["patch", "minor", "major"]
        patterns:
          - "aya*"

  # The stable Rust pin. The cargo ecosystem never reads
  # rust-toolchain.toml, which is why the pin sat on 1.95.0 while stable
  # moved on. This ecosystem only reads rust-toolchain(.toml) in the
  # listed directory, not below it, so the hand-pinned BPF nightlies in
  # crates/modules/*/bpf/ stay out of scope. CI reads the pin from the
  # same file, so a bump PR is tested on the compiler it proposes.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types: ["patch", "minor", "major"]

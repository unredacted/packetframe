name: VPP and Rust for a PacketFrame check
description: >-
  Install the system packages, the pinned Rust toolchain, and a VPP: the
  release SOURCE.json names, or a directory of candidate .debs.

# Shared by every check that runs PacketFrame against a real VPP
# (.github/actions/sampler-plugin, .github/actions/vpp-cli-compat), so
# each installs the same packages the same way, and vpp-unifi's content
# check (the installed files are its build's) holds for all of them.
# Runs in a Debian or Ubuntu container as root, after actions/checkout
# (ci.yml's `vpp-fdio-arm64` job passes fd.io's own Ubuntu debs as `vpp-debs`).
inputs:
  vpp-debs:
    description: >-
      A directory of VPP .debs to install instead of the release
      SOURCE.json names (vpp-unifi's pre-publish check of a candidate
      VPP). Empty: the release.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: System packages
      shell: bash
      # Bullseye left LTS on 2026-08-31; archive.debian.org is where every
      # bullseye suite lives now. Other distros keep their own sources.
      run: |
        if grep -qx 'VERSION_CODENAME=bullseye' /etc/os-release; then
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian bullseye-updates main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
        fi
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential clang libclang-dev pkg-config curl ca-certificates git jq procps

    - name: Install Rust (the toolchain rust-toolchain.toml pins)
      shell: bash
      # rustup reads rust-toolchain.toml itself: bullseye's Python predates
      # the tomllib that .github/actions/rust-stable-pin uses.
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        "$HOME/.cargo/bin/rustup" toolchain install

    - name: VPP from the release SOURCE.json names
      if: inputs.vpp-debs == ''
      shell: bash
      run: |
        set -eu
        src=crates/modules/vpp-offload/vpp-api/SOURCE.json
        repo=$(jq -r '.built_by' "$src" | cut -d@ -f1)
        distro=$(jq -r '.distro' "$src" | sed 's/^debian-//')
        # Same tag rule as ci.yml's byte-binding: a stable-branch build
        # names its commit.
        build=$(jq -r 'if (.vpp_branch // "") != "" then "-" + .vpp_commit[0:9] else "" end' "$src")
        tag="vpp-$(jq -r .vpp_ref "$src")$build-$(jq -r .platform "$src")-$distro-$(jq -r .arch "$src")"
        dl=$(mktemp -d) && cd "$dl"
        base="https://github.com/$repo/releases/download/$tag"
        curl -fsSLO "$base/SHA256SUMS"
        for p in vpp libvppinfra libvppinfra-dev vpp-dev vpp-plugin-core; do
          curl -fsSLO "$base/$(awk -v p="$p" '$2 ~ "^" p "_" { print $2 }' SHA256SUMS)"
        done
        awk 'FNR == NR { have[$1]; next } $2 in have' <(ls *.deb) SHA256SUMS | sha256sum -c -
        VPP_INSTALL_SKIP_SYSCTL=1 apt-get install -y --no-install-recommends ./*.deb
        # The deb's boot-time hugepage sysctl (see vpp-unifi's README).
        rm -f /etc/sysctl.d/80-vpp.conf
        vpp --version

    - name: VPP from the candidate debs
      if: inputs.vpp-debs != ''
      shell: bash
      env:
        VPP_DEBS: ${{ inputs.vpp-debs }}
      run: |
        set -eu
        debs=()
        for p in vpp libvppinfra libvppinfra-dev vpp-dev vpp-plugin-core; do
          f=$(find "$VPP_DEBS" -name "${p}_*.deb" -print -quit)
          [ -n "$f" ] || { echo "::error::no ${p}_*.deb under $VPP_DEBS"; exit 1; }
          debs+=("$f")
        done
        VPP_INSTALL_SKIP_SYSCTL=1 apt-get install -y --no-install-recommends "${debs[@]}"
        rm -f /etc/sysctl.d/80-vpp.conf
        vpp --version

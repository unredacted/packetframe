name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the run in flight; every push to main
# runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Keep the debug-profile target dir small: it is what the caches hold
  # and what `build` ships to the privileged and qemu jobs. Incremental
  # state is never reused by a fresh CI checkout, and full debuginfo is
  # most of a test binary's size; line tables keep file:line in panics
  # and backtraces. The release profile is untouched.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Pins for tools the Rust project itself publishes — GitHub runners
  # come with rustup pre-installed, so we manage toolchains and targets
  # via direct `rustup` commands rather than a third-party action. The
  # stable pin is not here: it lives only in rust-toolchain.toml and each
  # job reads it via .github/actions/rust-stable-pin.
  RUST_NIGHTLY: "nightly-2026-04-14"
  # bpf-linker pin — bump via reviewed PR. SPEC.md §7.1 calls out pinning
  # the BPF toolchain tight because aya/bpf-linker versions move together.
  BPF_LINKER_VERSION: "0.10.3"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    env:
      # Clippy runs the build scripts, and userspace code behind
      # `cfg(packetframe_bpf_built)` is only linted when the BPF build
      # really succeeded, so a stub fallback here would quietly lint less.
      PACKETFRAME_BPF_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-stable-pin

      - name: Install Rust (stable + nightly for BPF)
        # `bpfel-unknown-none` is a tier-3 target with no prebuilt
        # `rust-std`; we build `core` from source via `build-std` (set
        # in `crates/modules/fast-path/bpf/.cargo/config.toml`), which
        # only needs `rust-src`. Do not run `rustup target add
        # bpfel-unknown-none` — rustup would try to download a
        # nonexistent std component.
        run: |
          rustup toolchain install ${{ env.RUST_STABLE }} \
            --profile minimal --component rustfmt,clippy
          rustup default ${{ env.RUST_STABLE }}
          rustup toolchain install ${{ env.RUST_NIGHTLY }} \
            --profile minimal --component rust-src,llvm-tools-preview

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            crates/modules/fast-path/bpf/target/
            crates/modules/guard/bpf/target/
            crates/modules/flow-export/bpf/target/
            crates/modules/probe/bpf/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock', 'crates/modules/fast-path/bpf/Cargo.toml', 'crates/modules/guard/bpf/Cargo.toml', 'crates/modules/probe/bpf/Cargo.toml', 'crates/modules/flow-export/bpf/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Install bpf-linker
        run: |
          if ! command -v bpf-linker >/dev/null 2>&1 || \
             [ "$(bpf-linker --version 2>/dev/null | awk '{print $2}')" != "${{ env.BPF_LINKER_VERSION }}" ]; then
            cargo install --locked --force bpf-linker \
              --version ${{ env.BPF_LINKER_VERSION }}
          fi

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # release.yml's version gate runs only on a tag push or a manual
      # dispatch, so its checker is exercised here on every PR (hermetic:
      # a stub cargo and scratch CHANGELOGs), plus the real tree's check
      # so a PR that breaks VERSION/Cargo/CHANGELOG agreement fails now
      # rather than at release time.
      - name: release gate (script cases + this tree)
        run: |
          bash .github/scripts/release-test.sh
          bash .github/scripts/release.sh check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: VPP API codegen is up to date
        # The generated wire types are checked in so reviewers can read
        # them, but the vendored .api.json is the source of truth. A
        # bundle bump that changes a message shape MUST fail here
        # rather than ship an encoder that silently disagrees with the
        # VPP it talks to — which would corrupt a FIB, not error out.
        #
        # There is deliberately no separate "pin" file: the module is
        # generic over VPPs (the CRC handshake refuses any VPP whose
        # wire format disagrees at attach), so the ONLY version fact
        # this repo owns is "which API definitions the codegen ran
        # against" — and that is the vendored bundle plus SOURCE.json,
        # the manifest of the release it was extracted from. Everything
        # else (fetch pointers in the hwtest bundle and runbooks)
        # derives from SOURCE.json, so it cannot disagree with the
        # bundle. Re-vendor procedure: vpp-api/README.md.
        #
        # Two checks, closing different gaps:
        #   1. bytes against the release SOURCE.json names: download
        #      its vpp-api-json.tar.gz, verify against the release's
        #      SHA256SUMS, byte-compare every vendored .api.json, and
        #      diff SOURCE.json against the release's manifest. A
        #      re-vendor that updated either half without the other
        #      fails in both directions — nothing vendored attests
        #      itself, the release is the truth. A SOURCE.json naming
        #      a nonexistent release fails here instead of on a
        #      router.
        #   2. regenerate-and-diff: generated.rs matches the vendored
        #      bundle, so a re-vendor that skipped the codegen step
        #      (or a hand-edit of generated.rs) fails here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vendored=crates/modules/vpp-offload/vpp-api
          src_repo=$(jq -r '.built_by' "$vendored/SOURCE.json" | cut -d'@' -f1)
          src_ref=$(jq -r '.vpp_ref' "$vendored/SOURCE.json")
          src_platform=$(jq -r '.platform' "$vendored/SOURCE.json")
          # distro is recorded as "debian-<name>"; the tag wants the
          # bare name. Same tag construction as the publisher's.
          src_distro=$(jq -r '.distro' "$vendored/SOURCE.json" | sed 's/^debian-//')
          src_arch=$(jq -r '.arch' "$vendored/SOURCE.json")
          tag="vpp-${src_ref}-${src_platform}-${src_distro}-${src_arch}"
          dl=$(mktemp -d)
          gh release download "$tag" --repo "$src_repo" --dir "$dl" \
            --pattern 'vpp-api-json.tar.gz' --pattern 'manifest.json' --pattern 'SHA256SUMS'
          ( cd "$dl" && grep ' vpp-api-json\.tar\.gz$' SHA256SUMS | sha256sum -c - )
          if ! diff <(jq -S . "$dl/manifest.json") <(jq -S . "$vendored/SOURCE.json"); then
            echo "::error::SOURCE.json does not match its release's manifest.json — re-vendor both halves together (see $vendored/README.md)"
            exit 1
          fi
          mkdir "$dl/api" && tar xzf "$dl/vpp-api-json.tar.gz" -C "$dl/api"
          for f in "$vendored"/*.api.json; do
            base=$(basename "$f")
            rel=$(find "$dl/api" -name "$base" -print -quit)
            [ -n "$rel" ] || { echo "::error::$base is vendored but absent from its release's API bundle"; exit 1; }
            cmp -s "$rel" "$f" || { echo "::error::$base differs from its release's copy — the vendored bundle is stale, re-vendor it (see $vendored/README.md)"; exit 1; }
          done
          echo "vendored bundle matches $src_repo $tag byte for byte"

          cargo run -q -p packetframe-vpp-api-codegen -- \
            "$vendored" \
            crates/modules/vpp-offload/src/vpp_api/generated.rs
          if ! git diff --exit-code -- crates/modules/vpp-offload/src/vpp_api/generated.rs; then
            echo "::error::generated.rs is stale — re-run the codegen and commit the result"
            exit 1
          fi

  # Compiles every test binary once. The privileged tests then run from
  # that one build natively (`privileged`) and inside the 5.15 and 6.6
  # guests (`qemu`), none of which needs a Rust toolchain; the list of
  # what runs where is .github/scripts/privileged-tests.sh.
  build:
    name: build + test
    runs-on: ubuntu-latest
    outputs:
      bundled: ${{ steps.bundle.outputs.bundled }}
    env:
      # Refuse to stub-fallback on BPF build failure. Without this, a
      # broken BPF build silently produces an empty ELF and every
      # verifier/attach integration test early-returns "BPF stub in
      # effect" + reports `ok`, masking real regressions. The test
      # binaries embed the ELF, so this also covers the jobs that run
      # them.
      PACKETFRAME_BPF_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-stable-pin

      - name: Install Rust (stable + nightly for BPF)
        # No `rustup target add bpfel-unknown-none`: see `lint`.
        run: |
          rustup toolchain install ${{ env.RUST_STABLE }} --profile minimal
          rustup default ${{ env.RUST_STABLE }}
          rustup toolchain install ${{ env.RUST_NIGHTLY }} \
            --profile minimal --component rust-src,llvm-tools-preview

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            crates/modules/fast-path/bpf/target/
            crates/modules/guard/bpf/target/
            crates/modules/flow-export/bpf/target/
            crates/modules/probe/bpf/target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', 'crates/modules/fast-path/bpf/Cargo.toml', 'crates/modules/guard/bpf/Cargo.toml', 'crates/modules/probe/bpf/Cargo.toml', 'crates/modules/flow-export/bpf/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install bpf-linker
        run: |
          if ! command -v bpf-linker >/dev/null 2>&1 || \
             [ "$(bpf-linker --version 2>/dev/null | awk '{print $2}')" != "${{ env.BPF_LINKER_VERSION }}" ]; then
            cargo install --locked --force bpf-linker \
              --version ${{ env.BPF_LINKER_VERSION }}
          fi

      - name: Build test binaries
        id: bundle
        # json-render-diagnostics: compiler errors still print as text;
        # only the artifact list goes to the JSON the bundle reads.
        run: |
          set -euo pipefail
          cargo test --workspace --no-run --message-format=json-render-diagnostics \
            > "${RUNNER_TEMP}/cargo-test.json"
          .github/scripts/privileged-tests.sh bundle \
            "${RUNNER_TEMP}/cargo-test.json" privileged-tests.tar.zst
          echo "bundled=true" >> "${GITHUB_OUTPUT}"

      # Uploaded before the unprivileged tests run, so the privileged and
      # qemu jobs start as soon as the build is done.
      - uses: actions/upload-artifact@v7
        with:
          name: privileged-tests
          path: privileged-tests.tar.zst
          # Already zstd; a re-run of a failed downstream job reuses it.
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: cargo test
        run: cargo test --workspace

      # Every commit rebuilds these, so caching them only crowds the
      # repository's 10 GB cache budget (outgrowing it evicted this
      # job's cache on every run). Dependencies, build-script outputs
      # and proc macros all have a dot in their names and stay.
      - name: Drop test executables before the cache saves
        run: find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.*' -delete

  # Both run whenever the binaries were packed, even if `build`'s own
  # unprivileged tests then failed: one failure must not hide the others.
  privileged:
    name: privileged tests (native)
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.bundled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # For the runner script and the package directories the binaries
      # run from; nothing here compiles.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: privileged-tests

      - name: Unpack test binaries
        run: tar --zstd -xf privileged-tests.tar.zst

      - name: privileged tests (BPF verifier + attach, netns, tmpfs; sudo)
        # Integration tests that load the BPF ELF into the kernel, attach
        # it to an interface or mount a tmpfs need CAP_BPF +
        # CAP_NET_ADMIN, so they are all `#[ignore]`d for plain `cargo
        # test` and run here as root, on the runner's own kernel.
        #
        # PACKETFRAME_BENCH_QUICK: the fast-path benches run their sanity
        # asserts at a few hundred executions instead of 1M per bench
        # (full mode cost CI 3 minutes a run). A shared runner's ns/pkt
        # figures gate nothing; the full benches run on routers from the
        # hardware-artifacts bundle (`run-tests.sh bench`).
        env:
          PACKETFRAME_BENCH_QUICK: "1"
        run: sudo -E .github/scripts/privileged-tests.sh run native

  qemu:
    name: QEMU verifier
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.bundled == 'true' }}
    uses: ./.github/workflows/qemu-verifier.yml

  sampler-shm-arm64:
    name: sampler-shm (arm64)
    # The sampler rings and status seqlock are lock-free code shared by two
    # processes, VPP and PacketFrame. A missing ordering shows on aarch64's
    # weaker memory model (the EFG's) long before x86's, so the
    # two-process stress run and the loom model checks run on arm64
    # hardware. The `build` and `privileged` jobs run the same tests,
    # smaller, on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-stable-pin

      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_STABLE }} --profile minimal
          rustup default ${{ env.RUST_STABLE }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-sampler-shm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-sampler-shm-

      - name: cargo test (two processes, 20M samples through a 64-slot ring)
        env:
          PF_SHM_STRESS_N: "20000000"
        run: cargo test -p packetframe-sampler-shm --release

      - name: cargo test (tmpfs budget, sudo)
        run: sudo -E $(which cargo) test -p packetframe-sampler-shm --release --tests -- --ignored --nocapture

      - name: loom model checks
        # Its own target dir: `--cfg loom` rebuilds every crate.
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"
          CARGO_TARGET_DIR: target/loom
        run: cargo test -p packetframe-sampler-shm --release --test loom

  sampler-plugin-arm64:
    name: sampler plugin (arm64, VPP)
    # The plugin is built and smoke-tested by .github/actions/sampler-plugin,
    # which release.yml and hardware-artifacts.yml run too. A job (not a
    # reusable workflow) so this check keeps its name.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye
      # A tmpfs mount for the sampler directory, and VPP itself.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/sampler-plugin

      - uses: actions/upload-artifact@v7
        with:
          name: pf_sampler_plugin-${{ github.sha }}
          path: crates/vpp-plugins/pf-sampler/target/release/libpf_sampler.so
          if-no-files-found: error

  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Cross-build jobs are userspace-only smoke tests for each release
    # target triple. BPF bytecode is architecture-independent (it's BPF,
    # not native machine code), so building it four times inside `cross`
    # containers would be wasted work. The `build` job above builds it
    # once; these jobs stub it out via PACKETFRAME_SKIP_BPF_BUILD=1.
    env:
      PACKETFRAME_SKIP_BPF_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-stable-pin

      - name: Install Rust (stable + target)
        run: |
          rustup toolchain install ${{ env.RUST_STABLE }} \
            --profile minimal --component clippy
          rustup default ${{ env.RUST_STABLE }}
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # `cross build` below covers lib + bins only, and the `lint` job's
      # clippy run sees just the host triple, so *test* code that doesn't
      # compile for a release target slipped through both. It bit us
      # twice: `libc::ioctl`'s request argument is `c_ulong` on glibc but
      # `c_int` on musl, and `c_char` is signed on x86_64 but unsigned on
      # aarch64 — neither is visible from an x86_64-gnu lint of the
      # workspace. Clippy doesn't link, so `--all-targets` per triple is
      # cheap insurance, and it's what keeps the test tree cross-buildable
      # for `hardware-artifacts.yml`.
      - name: cargo clippy --all-targets
        run: |
          cargo clippy --workspace --all-targets --all-features \
            --target ${{ matrix.target }} -- -D warnings

      - name: Install cross
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install --locked cross
          fi

      - name: cross build --release
        run: cross build --release --workspace --target ${{ matrix.target }}

name: QEMU verifier

# SPEC.md §10.2: run the sudo-gated integration tests under two kernel
# versions — 5.15 (EFG-parity) and 6.6 LTS (≥5.18 for
# BPF_PROG_TEST_RUN_XDP_LIVE; the host CI job already covers whichever
# kernel ubuntu-latest runners ship with, so this matrix targets
# explicit EFG-parity + a modern LTS).

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Pin versions so adding a matrix dimension doesn't drift toolchains.
  RUST_NIGHTLY: "nightly-2026-04-14"
  BPF_LINKER_VERSION: "0.10.3"

jobs:
  qemu:
    name: qemu (kernel ${{ matrix.kernel_tag }})
    runs-on: ubuntu-latest
    env:
      PACKETFRAME_BPF_REQUIRED: "1"
    strategy:
      fail-fast: false
      matrix:
        # Canonical's mainline PPA hosts rebuilds of upstream releases.
        # We discover the actual .deb URL at runtime (build timestamps
        # vary per version) from the directory listing.
        kernel_tag: ["v5.15", "v6.6"]
    steps:
      - uses: actions/checkout@v7

      # GitHub's `ubuntu-latest` runners ship with ~14 GB free after
      # the preinstalled toolchains (CodeQL, Android SDK, .NET, etc.).
      # Adding the Option F tokio/rtnetlink/futures dep graph pushes
      # target/ past that during debug-profile linking and we get
      # "ld: signal 7 (Bus error)" / "No space left on device".
      # Dropping the hosted-tool caches we don't use recovers ~20 GB,
      # which is plenty of headroom. Standard
      # jlumbroso/free-disk-space-style idiom, inlined to avoid
      # pulling a non-first-party action.
      - name: Free disk space on runner
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: ./.github/actions/rust-stable-pin

      - name: Install Rust stable + nightly (for BPF)
        run: |
          rustup install ${RUST_STABLE} --profile minimal
          rustup default ${RUST_STABLE}
          rustup install ${RUST_NIGHTLY} --profile minimal
          rustup component add --toolchain ${RUST_NIGHTLY} rust-src llvm-tools-preview

      - name: Cache cargo + BPF target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            crates/modules/fast-path/bpf/target/
            crates/modules/guard/bpf/target/
            crates/modules/probe/bpf/target/
          key: ${{ runner.os }}-cargo-qemu-${{ matrix.kernel_tag }}-${{ hashFiles('**/Cargo.lock', 'crates/modules/fast-path/bpf/Cargo.toml', 'crates/modules/guard/bpf/Cargo.toml', 'crates/modules/probe/bpf/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-qemu-${{ matrix.kernel_tag }}-
            ${{ runner.os }}-cargo-qemu-
            ${{ runner.os }}-cargo-check-

      - name: Install bpf-linker
        run: |
          if ! command -v bpf-linker >/dev/null 2>&1 || \
             [ "$(bpf-linker --version 2>/dev/null | awk '{print $2}')" != "${BPF_LINKER_VERSION}" ]; then
            cargo install --locked --force bpf-linker --version ${BPF_LINKER_VERSION}
          fi

      - name: Install QEMU + virtme-ng
        run: |
          set -eux
          # Drop the vendor repos the hosted runner image ships and this
          # job does not use. `apt-get update` exits non-zero if ANY
          # configured source fails, so a 403 from packages.microsoft.com
          # — which happens periodically and has nothing to do with us —
          # fails the whole job before qemu is even installed (observed
          # 2026-08-12: azure-cli and prod both 403, exit 100, no test
          # ever ran). Everything below comes from the Ubuntu archive.
          #
          # Matched by CONTENT, not by filename. The 24.04 image writes
          # azure-cli as deb822 `/etc/apt/sources.list.d/azure-cli.sources`,
          # which a `*.list` glob silently misses — so a glob-based
          # version of this step would have left the exact repo that
          # broke the job enabled (review finding). Grepping for the
          # hosts that failed covers .list and .sources alike, and keeps
          # working when the image renames them again.
          sudo grep -rlE 'packages\.microsoft\.com|dl\.google\.com' \
              /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          ls -la /etc/apt/sources.list.d/ || true
          sudo apt-get update
          # virtme-ng is the maintained fork (classic virtme-run uses
          # -watchdog which QEMU 8.x dropped). Its `--run <deb>` accepts
          # a pre-built kernel package directly.
          sudo apt-get install -y qemu-system-x86 virtme-ng busybox-static
          virtme-ng --version || true

      # The test kernel comes from Canonical's mainline archive
      # (kernel.ubuntu.com), a single unmirrored host. It returned 503
      # for ~40 minutes on 2026-09-28 and every qemu job failed before
      # running a test, blocking merges. So the resolved .debs are
      # cached per kernel series, and an exact cache hit never touches
      # the host at all.
      #
      # Key = series + ISO week: the first run of each week re-reads
      # the directory index (so selection still tracks the host), and
      # restore-keys hand back an earlier week's pair as the fallback
      # when that refresh fails. Caches saved on main are readable from
      # every PR; a PR's own saves stay scoped to that PR.
      - name: Compute kernel cache week
        id: kernel-week
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore cached kernel .debs
        id: kernel-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pf-qemu-kernel
          key: ${{ runner.os }}-qemu-kernel-v1-${{ matrix.kernel_tag }}-${{ steps.kernel-week.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-qemu-kernel-v1-${{ matrix.kernel_tag }}-

      - name: Fetch + install kernel + modules
        id: kernel-fetch
        env:
          KERNEL_TAG: ${{ matrix.kernel_tag }}
          CACHE_HIT: ${{ steps.kernel-cache.outputs.cache-hit }}
        run: |
          set -eux
          HOST="kernel.ubuntu.com"
          BASE="https://${HOST}/mainline/${KERNEL_TAG}/amd64/"
          # Holds exactly one coherent image+modules pair and is only
          # ever replaced whole (promotion below), so a half-finished
          # refresh can never pair a new image with stale modules.
          CACHE_DIR="${HOME}/.cache/pf-qemu-kernel"
          NEW_DIR="${RUNNER_TEMP}/pf-qemu-kernel.new"
          mkdir -p "${CACHE_DIR}"
          IMG_PAT='linux-image-unsigned-[0-9][^"]*generic_[^"]*_amd64\.deb'
          MOD_PAT='linux-modules-[0-9][^"]*generic_[^"]*_amd64\.deb'
          # --retry-all-errors: plain --retry skips some HTTP errors,
          # and the index fetch used to have no retry at all.
          CURL=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20)

          pick() { grep -oE "$1" | sort -u | head -1 || true; }
          use_cached() {
            IMG_DEB=$(ls "${CACHE_DIR}" | pick "${IMG_PAT}")
            MOD_DEB=$(ls "${CACHE_DIR}" | pick "${MOD_PAT}")
            [ -n "${IMG_DEB}" ] && [ -n "${MOD_DEB}" ]
          }

          FRESH=false
          if [ "${CACHE_HIT}" = "true" ] && use_cached; then
            echo "Exact cache hit for ${KERNEL_TAG} this week; not contacting ${HOST}"
          else
            IMG_DEB=""; MOD_DEB=""
            # Same selection as before caching existed: first sorted
            # match of each pattern in the directory index.
            if INDEX=$("${CURL[@]}" --max-time 60 "${BASE}"); then
              IMG_DEB=$(printf '%s' "${INDEX}" | pick "${IMG_PAT}")
              MOD_DEB=$(printf '%s' "${INDEX}" | pick "${MOD_PAT}")
            fi
            if [ -n "${IMG_DEB}" ] && [ -n "${MOD_DEB}" ]; then
              rm -rf "${NEW_DIR}"; mkdir -p "${NEW_DIR}"
              ok=true
              for deb in "${IMG_DEB}" "${MOD_DEB}"; do
                if [ -s "${CACHE_DIR}/${deb}" ]; then
                  # An earlier week's restore already holds this file.
                  cp "${CACHE_DIR}/${deb}" "${NEW_DIR}/${deb}"
                elif ! "${CURL[@]}" -o "${NEW_DIR}/${deb}" "${BASE}${deb}" \
                    || ! dpkg-deb --info "${NEW_DIR}/${deb}" >/dev/null; then
                  ok=false
                fi
              done
              if [ "${ok}" = true ]; then
                rm -rf "${CACHE_DIR}"
                mv "${NEW_DIR}" "${CACHE_DIR}"
                FRESH=true
              fi
            fi
            if [ "${FRESH}" != true ]; then
              if use_cached; then
                echo "::warning::${HOST} unreachable for ${KERNEL_TAG} after retries; using cached ${IMG_DEB} + ${MOD_DEB} from an earlier week"
              else
                echo "::error::Could not fetch the ${KERNEL_TAG} test kernel from ${HOST} (${BASE}) after retries, and no cached copy exists to fall back on. Re-run once ${HOST} is reachable."
                exit 1
              fi
            fi
          fi
          echo "fresh=${FRESH}" >> "${GITHUB_OUTPUT}"
          # Stage then cp (direct dpkg-deb -x to / clobbered /lib perms
          # on a previous iteration — see commit history).
          sudo rm -rf /tmp/kstage
          sudo mkdir -p /tmp/kstage
          sudo dpkg-deb -x "${CACHE_DIR}/${IMG_DEB}" /tmp/kstage
          sudo dpkg-deb -x "${CACHE_DIR}/${MOD_DEB}" /tmp/kstage
          sudo cp -a /tmp/kstage/boot/. /boot/
          sudo cp -a /tmp/kstage/lib/modules/. /lib/modules/
          KVER=$(ls /tmp/kstage/lib/modules/ | grep -- '-generic$' | tail -1)
          test -n "${KVER}"
          sudo depmod -a "${KVER}"
          # Canonical ships vmlinuz as 0600 root; virtme-ng runs as the
          # non-root job user and can't read it otherwise.
          sudo chmod 0644 "/boot/vmlinuz-${KVER}"
          test -r "/boot/vmlinuz-${KVER}"
          test -d "/lib/modules/${KVER}"
          # Sanity: host toolchain still links.
          test -e /lib/x86_64-linux-gnu/libm.so.6
          echo "KVER=${KVER}" >> "${GITHUB_ENV}"
          echo "KERNEL_IMG=/boot/vmlinuz-${KVER}" >> "${GITHUB_ENV}"

      # Saved right away rather than in a post-step, so a later test
      # failure still keeps the fresh pair. Only a fresh fetch is
      # saved: a stale fallback must not claim this week's key, or the
      # rest of the week would skip the refresh.
      - name: Save kernel .debs to cache
        if: steps.kernel-fetch.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pf-qemu-kernel
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}

      - name: Build integration tests
        run: |
          # Build so the test binaries are ready to exec inside the VM.
          # `--no-run` produces the ELFs without executing them on the
          # host kernel.
          cargo test -p packetframe-fast-path --tests --no-run
          cargo test -p packetframe-guard --tests --no-run
          cargo test -p packetframe-neigh-snoop --tests --no-run
          cargo test -p packetframe-probe --tests --no-run
          cargo test -p packetframe-vpp-offload --test drift_netns --no-run

      - name: Run integration tests in QEMU
        # Two full attempts must fit (see retry policy below); a
        # healthy run is ~7 minutes under TCG.
        timeout-minutes: 20
        run: |
          set -eux
          # Pass the installed vmlinuz path (not the .deb). virtme-ng
          # discovers matching modules at /lib/modules/$VER on the host
          # and packages them into its generated initramfs.
          # virtme-init starts the script with HOME=/ and `/` is RO
          # (only the listed overlay paths are writable). Point
          # HOME/CARGO_HOME/RUSTUP_HOME at the /home overlay so rustup
          # can write its state without going read-only.
          # --memory 8192 (1024 → 4096 → 6144 → here): virtme-ng sizes the
          # in-VM tmpfs against RAM, and the in-VM incremental relink
          # of the test binaries is what fills it. 4 GB (~2 GB tmpfs)
          # was sized for the Option F dep graph; the v0.2.8 fib-cache
          # branch's grown fast-path test set pushed the subsequent
          # probe-crate relink over the edge — `ld terminated with
          # signal 7 [Bus error]` twice in a row on the 6.6 leg, at
          # the same link. 6 GB ⇒ ~3 GB tmpfs restores the margin;
          # hosted runners have 16 GB, so TCG + 6 GB guest is fine.
          # The 2026-09 test growth put the same probe relink over
          # ~3 GB again, on both legs of every PR: 8 GB => ~4 GB
          # tmpfs, still leaving the 16 GB host half.
          # PACKETFRAME_BENCH_SKIP=1: skip the fast-path bench tests
          # outright. bpf_test_run executes uninterruptibly, and under
          # TCG a bench stalls a vCPU past the soft-lockup watchdog;
          # the per-fire ~35-line splat to the emulated serial console
          # then compounds until the 20-min job timeout. Two rounds of
          # PACKETFRAME_BENCH_QUICK capping (per-syscall repeat in
          # #82, then a ~400-execution total budget) still flaked on
          # slow 5.15 runners (PR #206, PR #207) — runner speed varies
          # too much for any fixed budget. Bench numbers under TCG are
          # meaningless anyway; the benches still run full-mode in
          # ci.yml's native sudo step and on routers via the
          # hardware-artifacts bundle.
          #
          # watchdog_thresh=60 (default 10, softlockup fires at 2x+2s):
          # belt-and-braces for the remaining fixture tests — any
          # uninterruptible test_run syscall can stall a TCG vCPU, and
          # a splat storm is what turns one stall into a job timeout.
          run_vm() {
            virtme-ng \
              --run "${KERNEL_IMG}" \
              --pwd \
              --memory 8192 \
              --disable-kvm \
              --append "watchdog_thresh=60" \
              --verbose \
              -- bash -c 'set -eux; export HOME=/home/runner; export CARGO_HOME="${HOME}/.cargo"; export RUSTUP_HOME="${HOME}/.rustup"; export PATH="${CARGO_HOME}/bin:${PATH}"; export PACKETFRAME_BENCH_SKIP=1; uname -a; which cargo; cargo test -p packetframe-fast-path --tests -- --ignored --nocapture; cargo test -p packetframe-guard --tests -- --ignored --nocapture; cargo test -p packetframe-neigh-snoop --tests -- --ignored --nocapture; cargo test -p packetframe-probe --tests -- --ignored --nocapture; cargo test -p packetframe-vpp-offload --test drift_netns -- --ignored --nocapture'
          }
          # Retry policy: virtme-ng propagates the guest command's exit
          # status, so a genuine test failure arrives as cargo's 101
          # and fails immediately — no retry. Exit 255 means the VM
          # died before the guest script ever ran (observed on hosted
          # runners as a TCG boot hang: dmesg stops mid PCI
          # enumeration ~20s in, zero test output; PR #69's v6.6 job).
          # That failure mode is runner noise, not a signal about the
          # code, so it gets exactly one more attempt.
          rc=0; run_vm || rc=$?
          if [ "${rc}" -eq 255 ]; then
            echo "::warning::virtme-ng exited 255 before the guest script ran (boot flake); retrying once"
            rc=0; run_vm || rc=$?
          fi
          exit "${rc}"

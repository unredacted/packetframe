name: VPP build (bullseye/arm64)

# Builds UNMODIFIED upstream VPP for the vpp-offload module and
# publishes it under its own release tag.
#
# Why this workflow exists: no VPP package exists for Debian 11 arm64
# anywhere (fd.io ships noble/jammy arm64 + bookworm amd64; Debian has
# never packaged VPP), and the jammy arm64 deb cannot run on UniFi OS —
# its symbol floor is GLIBC_2.34 against our 2.31, and bullseye's dpkg
# can't even unpack its zstd members. Someone has to link VPP against
# bullseye's libc; this is where.
#
# Cost control: the artifacts are a function of `vpp/pin.toml` ALONE,
# not of packetframe's version. So this does NOT run on release tags —
# packetframe releases roughly monthly while the VPP pin changes maybe
# twice a year, and release-triggering would burn ~45 min of CI per
# release reproducing byte-identical output. It runs when the pin file
# changes, or on demand. The first job then checks whether that exact
# artifact is already published and skips the build entirely if so, so
# even an accidental trigger costs seconds.
#
# Native arm64 runners (free for public repos) with a bullseye
# container: no QEMU, no cross-compile, correct glibc by construction.

on:
  push:
    # main ONLY. This workflow has contents:write and derives a
    # canonical release tag from the pin alone, so an unfiltered push
    # trigger would let any collaborator's feature branch publish that
    # tag — and the later main run would then SKIP its build on the
    # existence check, leaving the fleet's artifact built from unmerged
    # workflow code.
    branches: [main]
    paths:
      - 'vpp/pin.toml'
      - '.github/workflows/vpp-build.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the pinned artifact is already published'
        type: boolean
        default: false
      publish:
        description: 'Publish the result (uncheck to build-and-verify only)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve pin
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      commit: ${{ steps.pin.outputs.commit }}
      platform: ${{ steps.pin.outputs.platform }}
      tag: ${{ steps.pin.outputs.tag }}
      needs_build: ${{ steps.exists.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse vpp/pin.toml
        id: pin
        run: |
          set -euo pipefail
          # Deliberately grep-based: adding a TOML parser to a job whose
          # only input is three scalar fields is not worth the dependency.
          # `|| true` on each: `commit` and `platform` are documented
          # as optional, but grep exits 1 on no-match and `set -e`
          # would abort the step — so omitting an optional field would
          # have prevented any build at all.
          ref=$(grep -E '^\s*ref\s*=' vpp/pin.toml | head -1 | cut -d'"' -f2 || true)
          commit=$(grep -E '^\s*commit\s*=' vpp/pin.toml | head -1 | cut -d'"' -f2 || true)
          platform=$(grep -E '^\s*platform\s*=' vpp/pin.toml | head -1 | cut -d'"' -f2 || true)
          [ -n "$ref" ] || { echo "::error::vpp/pin.toml has no ref"; exit 1; }
          [ -n "$platform" ] || platform=generic
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "tag=vpp-${ref}-${platform}-bullseye-arm64" >> "$GITHUB_OUTPUT"
          echo "Pinned: $ref ($platform) -> release tag vpp-${ref}-${platform}-bullseye-arm64"

      - name: Skip if already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tag='${{ steps.pin.outputs.tag }}'
          force='${{ inputs.force }}'

          # The tag is derived from the PIN alone, but the artifact is
          # a function of the pin AND this workflow's build config —
          # which disabled-driver overrides made materially true. So a
          # workflow change that alters what gets built would otherwise
          # hit the existence check and skip, leaving the fleet on an
          # artifact built from superseded config, under a tag implying
          # otherwise. Detect it and rebuild.
          #
          # Cost note against this file's own cost-control rationale:
          # the workflow path is already a trigger, so this only fires
          # on a push that edited it — twice a year in practice. It
          # cannot distinguish a comment edit from a driver-list
          # change, and rebuilding needlessly is far cheaper than
          # silently shipping a stale artifact.
          wf_changed=false
          if [ '${{ github.event_name }}' = 'push' ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != '0000000000000000000000000000000000000000' ]; then
            if gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
                 --jq '.files[].filename' 2>/dev/null \
                 | grep -qx '.github/workflows/vpp-build.yml'; then
              wf_changed=true
            fi
          fi

          if [ "$force" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "force requested; rebuilding"
          elif ! gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          elif [ "$wf_changed" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag exists, but this push changed the build workflow — rebuilding and replacing it."
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already published; nothing to build. Re-run with force to rebuild."
          fi

  build:
    name: Build VPP ${{ needs.resolve.outputs.ref }} (${{ needs.resolve.outputs.platform }})
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    # Native arm64; free on public repos. The container supplies the
    # distro, so the runner image's own version is irrelevant.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye
    timeout-minutes: 120
    # VPP's `make install-dep` runs its own apt-get, and UNATTENDED=y
    # only adds `-y` — it does not set a debconf frontend. Part of the
    # dependency closure (wireshark-common) asks a debconf question, so
    # apt falls back to the Readline frontend and prompts, and the job
    # HANGS: a container job's stdin is an open pipe that never
    # delivers EOF, so the read parks forever with no error and no
    # output. Observed for 26 minutes before cancellation. (Set
    # job-wide rather than per-step: the per-command form in
    # `Container prerequisites` never reached VPP's nested apt-get.)
    env:
      DEBIAN_FRONTEND: noninteractive
    # Container jobs get `sh -e` as the default shell, and dash has no
    # `set -o pipefail` — the first build attempt died on line 1 of the
    # first step. Everything below is bash; the bootstrap step opts
    # back down to sh because it is what installs bash's guarantees.
    defaults:
      run:
        shell: bash
    steps:
      - name: Container prerequisites
        shell: sh
        run: |
          set -eu
          apt-get update
          # `sudo` because VPP's `make install-dep` invokes it
          # unconditionally; in a root container it must exist and be a
          # no-op passthrough.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates sudo make python3 python3-pip curl xz-utils \
            build-essential file jq
          echo "glibc: $(ldd --version | head -1)"

      - name: Clone upstream VPP at the pinned ref
        run: |
          set -euo pipefail
          git clone --depth 1 --branch '${{ needs.resolve.outputs.ref }}' \
            https://github.com/FDio/vpp /vpp
          cd /vpp
          resolved=$(git rev-parse HEAD)
          echo "VPP_COMMIT=$resolved" >> "$GITHUB_ENV"
          expected='${{ needs.resolve.outputs.commit }}'
          if [ -n "$expected" ] && [ "$expected" != "$resolved" ]; then
            echo "::error::pin.toml expects commit $expected but ${{ needs.resolve.outputs.ref }} resolves to $resolved (upstream retag?)"
            exit 1
          fi
          echo "Building $resolved"
          # Prove we ship upstream: no patches applied anywhere in this
          # workflow. If that ever changes, this assertion must change
          # with it, deliberately.
          git status --porcelain | grep -q . && { echo "::error::working tree dirty after clone"; exit 1; } || true

      - name: Install VPP build dependencies
        run: |
          set -euo pipefail
          cd /vpp
          # `< /dev/null` belt-and-braces alongside the job-level
          # DEBIAN_FRONTEND: a container job's stdin is an open pipe
          # that never delivers EOF, so any package whose maintainer
          # script reads stdin blocks forever rather than failing. The
          # first attempt at this build hung here for 26 minutes on
          # wireshark-common's dumpcap question before being cancelled.
          # Redirecting guarantees a read returns instead of parking.
          UNATTENDED=y make install-dep < /dev/null

      # VPP 26.06's CMakeLists.txt sets cmake_minimum_required(3.19);
      # bullseye ships 3.18.4, so `make build-release` aborts at
      # vpp-configure with "CMake 3.19 or higher is required". Note
      # what this does and does not mean: VPP's Makefile really does
      # have debian-11 handling and `install-dep` really does succeed —
      # what has moved past bullseye is the TOOLCHAIN requirement, not
      # dependency packaging. The two are easy to conflate.
      #
      # Upstream's own aarch64 binary, pinned with a checksum rather
      # than pulled from bullseye-backports: cmake is a build-time tool
      # that leaves no trace in the produced .debs (it cannot raise the
      # glibc floor, which is the only reason we build on bullseye at
      # all), and a pinned tarball does not depend on the lifecycle of a
      # backports suite for a release nearing EOL. Deliberately a 3.31
      # and not a 4.x: CMake 4 dropped compatibility with
      # cmake_minimum_required < 3.5, which VPP's vendored externals
      # still rely on.
      - name: Install CMake (bullseye's 3.18 is below VPP's floor)
        env:
          CMAKE_VERSION: '3.31.9'
          CMAKE_SHA256: '09b7127b09e3d3ed5fa894f4e59f6a01112f267da6acc4249e46dba97b14afcb'
        run: |
          set -euo pipefail
          series="${CMAKE_VERSION%.*}"
          tarball="cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://cmake.org/files/v${series}/${tarball}"
          echo "${CMAKE_SHA256}  /tmp/${tarball}" | sha256sum -c -
          # --strip-components=1 into /usr/local keeps cmake's modules
          # in the share/ path it resolves relative to the binary.
          tar -xzf "/tmp/${tarball}" -C /usr/local --strip-components=1
          hash -r
          cmake --version
          # /usr/local/bin precedes /usr/bin, but assert rather than
          # assume: install-dep may have pulled bullseye's cmake, and
          # silently building with 3.18 is the failure we just fixed.
          have=$(cmake --version | head -1 | awk '{print $3}')
          major=${have%%.*}; rest=${have#*.}; minor=${rest%%.*}
          if [ "$major" -lt 3 ] || { [ "$major" -eq 3 ] && [ "$minor" -lt 19 ]; }; then
            echo "::error::cmake $have is below VPP's 3.19 floor (which cmake: $(command -v cmake))"
            exit 1
          fi

      # VPP's DPDK recipe disables the ENTIRE cnxk family by default —
      # `common/cnxk`, `net/cnxk`, `mempool/cnxk`, `crypto/cnxk` all
      # appear in DPDK_DRIVERS_DISABLED, and `cnxk` in
      # DPDK_LIBS_DISABLED. That is upstream's choice for a portable
      # build, and it is why the first artifact carried no Octeon
      # driver at all: not a packaging accident, and not something a
      # different VPP version fixes, because the disable list is
      # long-standing. VPP 26.06 also has no native `dev_octeon` — its
      # vpp_drivers/ ships atlantic, iavf and ige only — so DPDK's cnxk
      # PMD is the only way this VPP can reach an Octeon NIC.
      #
      # Re-enabling it is a BUILD-CONFIG override, not a patch: the
      # source tree stays verbatim (the clone step still asserts a
      # clean working tree), we only pass different make variables.
      #
      # Derived from the pinned tree rather than hardcoded, so the rest
      # of upstream's disable list keeps whatever upstream decides it
      # should be across version bumps; we subtract cnxk and nothing
      # else. Enabled unconditionally rather than under the cn9k
      # platform, because `platform` means CPU TUNING here — a generic
      # armv8-a build still has to drive this fleet's NIC.
      - name: Re-enable the cnxk driver family in DPDK
        run: |
          set -euo pipefail
          cd /vpp/build/external
          # Ask make for the EFFECTIVE lists rather than parsing the
          # .mk. Parsing is wrong here in a way that is easy to miss:
          # the base lists are `:=` continued over ~40 backslashed
          # lines, and dpdk.mk then APPENDS to them conditionally
          # (net/tap, net/failsafe, and the mlx family, depending on
          # DPDK_*_PMD). A file-scraped base list would silently drop
          # those and enable drivers upstream meant to stay off.
          # Including the real Makefile evaluates all of it, including
          # the package versions dpdk.mk requires to parse at all.
          # printf, not a heredoc: make demands a literal TAB to start a
          # recipe line, and a heredoc indented to match this YAML block
          # would prepend spaces (while `<<-` strips tabs, including the
          # one that matters). Single quotes keep `$(...)` for make.
          printf 'include Makefile\n__pf_print:\n\t@echo "$(DPDK_DRIVERS_DISABLED)"\n\t@echo "$(DPDK_LIBS_DISABLED)"\n' \
            > /tmp/pf-dpdk-vars.mk
          vars=$(make -s -f /tmp/pf-dpdk-vars.mk __pf_print | tail -2)
          drivers=$(printf '%s' "$vars" | sed -n 1p)
          libs=$(printf '%s' "$vars" | sed -n 2p)

          filter() {
            # Drop every member of the Octeon driver families and
            # nothing else: cnxk (common/, net/, mempool/, crypto/, and
            # the bare `cnxk` lib) plus octeontx2, the name the same
            # silicon used before DPDK 22.11 renamed it.
            #
            # octeontx2 is a no-op on every version in the fallback
            # ladder — checked, not assumed: v22.02 disables neither
            # family (so its octeontx2 PMD is on by default), v23.06
            # disables only cnxk, and 26.03 has no octeontx2 driver at
            # all. It is here as insurance for a version that does,
            # since removing an absent entry costs nothing.
            #
            # Deliberately NOT matched: compress/octeontx, event/octeontx
            # and mempool/octeontx — those are OCTEON TX v1, different
            # silicon, and upstream means them disabled. `octeontx2`
            # cannot match `octeontx`.
            printf '%s' "$1" | tr ',' '\n' \
              | grep -v -e cnxk -e octeontx2 | grep -v '^$' | paste -sd, -
          }
          for pair in "DRIVERS:$drivers" "LIBS:$libs"; do
            name=${pair%%:*}; val=${pair#*:}
            # An empty or single-token result means the evaluation went
            # wrong; overriding with it would enable every driver DPDK
            # has. Stopping here is much cheaper than that build.
            case "$val" in
              *,*) : ;;
              *) echo "::error::DPDK_${name}_DISABLED evaluated to '$val' — upstream layout changed?"; exit 1 ;;
            esac
            echo "$name removing: $(printf '%s' "$val" | tr ',' '\n' | grep -e cnxk -e octeontx2 | paste -sd, - || echo none)"
          done
          printf '%s' "$drivers" | grep -q -e cnxk -e octeontx2 \
            || echo "::warning::upstream disables no Octeon driver family at this ref; the override is a no-op (fine — it means the PMD ships enabled)"

          {
            echo "DPDK_DRIVERS_KEPT=$(filter "$drivers")"
            echo "DPDK_LIBS_KEPT=$(filter "$libs")"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -euo pipefail
          cd /vpp
          # Command-line make variables override the makefile's own
          # assignments (these are `=`/`:=`, not `?=`, so environment
          # alone would lose) and propagate to the external sub-make.
          args=(
            "DPDK_DRIVERS_DISABLED=$DPDK_DRIVERS_KEPT"
            "DPDK_LIBS_DISABLED=$DPDK_LIBS_KEPT"
          )
          if [ '${{ needs.resolve.outputs.platform }}' = 'cn9k' ]; then
            # Marvell-tuned variant: LSE atomics + tuned memcpy, plus
            # DPDK's own cn9k platform tuning. Only meaningful once
            # packet-rate-bound; produces a separately tagged artifact.
            args+=(DPDK_MACHINE=cn9k VPP_EXTRA_CMAKE_ARGS='-DVPP_LIBRARY_FLAGS=-mcpu=octeontx2')
          fi
          printf 'make arg: %s\n' "${args[@]}"
          make build-release "${args[@]}"

      - name: Package .debs
        run: |
          set -euo pipefail
          cd /vpp
          make pkg-deb
          mkdir -p /out/debs
          find build-root -maxdepth 1 -name '*.deb' -exec cp {} /out/debs/ \;
          ls -la /out/debs
          [ -n "$(ls -A /out/debs)" ] || { echo "::error::no .debs produced"; exit 1; }

      # Fast smoke test on the staging tree so an obviously broken
      # build fails before we spend time packaging. It is NOT the
      # gate — the staging tree has every build dependency present and
      # the binaries at build paths, so it cannot catch a package that
      # omits a library, installs to the wrong path, or is missing
      # dependency metadata. The `verify-package` job below does that.
      - name: Smoke-test the build tree
        run: |
          set -euo pipefail
          root=/vpp/build-root/install-vpp-native/vpp
          vpp_bin="$root/bin/vpp"
          [ -x "$vpp_bin" ] || { echo "::error::no vpp binary at $vpp_bin"; exit 1; }

          # THE regression guard: this is the exact check that killed the
          # fd.io jammy deb (GLIBC_2.34 vs our 2.31). An artifact that
          # can't load on the fleet must never reach a release page.
          floor=$(objdump -T "$vpp_bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "glibc symbol floor: ${floor:-none}"
          max_minor=$(echo "${floor:-GLIBC_2.0}" | cut -d. -f2)
          if [ "$max_minor" -gt 31 ]; then
            echo "::error::binary requires $floor but UniFi OS ships glibc 2.31"
            exit 1
          fi

          # Layout, for the record. Printed unconditionally because the
          # first version of this step hardcoded lib/vpp_plugins and VPP
          # installs to a multiarch libdir; having the tree in the log
          # makes the next path surprise self-diagnosing.
          echo "--- install tree ---"
          find "$root" -maxdepth 3 -type d | sort

          # The NIC driver must be in the bundled DPDK, or VPP cannot
          # touch the hardware at all. Two shapes to accept, because
          # which one you get is a DPDK build option, not a constant:
          # the PMD may be linked INTO dpdk_plugin.so, or shipped as a
          # standalone librte_net_*.so under dpdk/pmds-<abi>/ (this
          # build logs `symlink-drivers-solibs.sh lib dpdk/pmds-26.1`,
          # i.e. the standalone shape). Checking only the first is how
          # a perfectly good build got failed.
          echo "--- driver inventory ---"
          find "$root" \( -path '*vpp_drivers*' -o -path '*dpdk*' -o -name 'librte_net_*' \) \
            -type f | sort
          echo "--- end inventory ---"

          # Three shapes count as "this build can drive our NIC", and
          # the third is the one that broke the previous assumption:
          #
          #  1. VPP's NATIVE Octeon driver (dev_octeon, under
          #     vpp_drivers/). VPP >= 24.02 has its own device
          #     framework, and 26.06's build downloads and compiles
          #     marvell-octeon-roc specifically to feed it — visible in
          #     the log as "installing octeon-roc 26.05". This path
          #     does not involve DPDK at all.
          #  2. DPDK's cnxk/octeontx2 PMD as a standalone
          #     librte_net_*.so.
          #  3. The same PMD linked into dpdk_plugin.so.
          #
          # The previous revision accepted only 2 and 3 and failed a
          # build that had 1 — a `strings dpdk_plugin.so | grep
          # net_cnxk` that finds nothing is evidence about DPDK's
          # driver set, not about whether VPP can reach the hardware.
          # Which shape we get decides the startup.conf that gate 0b
          # writes, so the manifest records it rather than flattening
          # it to a boolean.
          native=$(find "$root" -name 'dev_octeon*.so*' -print -quit)
          pmd_so=$(find "$root" \( -name 'librte_net_cnxk*' -o -name 'librte_net_octeontx2*' \) -print -quit)
          plugin=$(find "$root" -name 'dpdk_plugin.so' -print -quit)
          driver=''
          if [ -n "$native" ]; then
            echo "native Octeon driver: $native"
            driver=dev_octeon
          fi
          if [ -n "$pmd_so" ]; then
            echo "standalone DPDK PMD: $pmd_so"
            case "$pmd_so" in *cnxk*) driver="${driver:+$driver,}net_cnxk" ;;
                              *) driver="${driver:+$driver,}net_octeontx2" ;; esac
          elif [ -n "$plugin" ]; then
            linked=$(strings "$plugin" | grep -m1 -oE 'net_cnxk|net_octeontx2' || true)
            [ -n "$linked" ] && echo "PMD linked into $plugin: $linked"
            driver="${driver:+$driver,}${linked}"
            driver="${driver%,}"
          fi
          echo "octeon driver(s): ${driver:-NONE}"
          if [ -z "$driver" ]; then
            echo "::error::this build has no way to drive the Octeon NIC — neither VPP's native dev_octeon nor a DPDK cnxk/octeontx2 PMD (see inventory above)"
            exit 1
          fi
          echo "PMD_FAMILY=$driver" >> "$GITHUB_ENV"

          # Unresolved-symbol smoke test. `vpp -h` needs its own libs on
          # the path; a clean exit or a usage message both prove linkage.
          # Every lib dir, not a guessed one, for the multiarch reason
          # above.
          LD_LIBRARY_PATH=$(find "$root" -type d -name 'lib*' -maxdepth 2 | tr '\n' ':')
          export LD_LIBRARY_PATH
          "$vpp_bin" -h >/dev/null 2>&1 || true
          ldd "$vpp_bin" | grep -q 'not found' && { echo "::error::unresolved shared libs"; ldd "$vpp_bin" | grep 'not found'; exit 1; } || true

      - name: Collect API definitions (slice 3 codegen input)
        run: |
          set -euo pipefail
          mkdir -p /out/api
          # Published as a separate small asset so the codegen job never
          # downloads ~100 MB of .debs just to read message definitions.
          # Located rather than hardcoded, for the multiarch reason in
          # the smoke-test step. Copying the api dir wholesale keeps
          # upstream's core/ vs plugins/ split, which slice 3's codegen
          # uses to namespace generated modules; the fallback flattens
          # because a build tree without share/vpp/api has no split to
          # preserve anyway.
          api_dir=$(find /vpp/build-root -type d -path '*/share/vpp/api' -print -quit)
          if [ -n "$api_dir" ]; then
            echo "api dir: $api_dir"
            cp -r "$api_dir/." /out/api/
          else
            echo "::warning::no share/vpp/api dir; falling back to a flat scan"
            find /vpp/build-root -name '*.api.json' -exec cp {} /out/api/ \;
          fi
          count=$(find /out/api -name '*.api.json' | wc -l)
          echo "api.json files: $count"
          [ "$count" -gt 0 ] || { echo "::error::no .api.json produced"; exit 1; }
          tar czf /out/vpp-api-json.tar.gz -C /out/api .

      - name: Write manifest
        run: |
          set -euo pipefail
          cd /out
          jq -n \
            --arg ref '${{ needs.resolve.outputs.ref }}' \
            --arg commit "$VPP_COMMIT" \
            --arg platform '${{ needs.resolve.outputs.platform }}' \
            --arg pmd "${PMD_FAMILY:-unknown}" \
            --arg built_by '${{ github.repository }}@${{ github.sha }}' \
            --arg run '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{vpp_ref:$ref, vpp_commit:$commit, platform:$platform, distro:"debian-bullseye",
              arch:"arm64", octeon_pmd:$pmd, patches:"none (upstream verbatim)",
              built_by:$built_by, workflow_run:$run}' > manifest.json
          # Flat names: `gh release create` uploads these as flat
          # assets, so a `debs/` prefix would make `sha256sum -c`
          # unverifiable after a download-into-one-directory (which is
          # exactly what the hwtest bundle's instructions tell people
          # to do).
          ( cd debs && sha256sum ./*.deb | sed 's#\./##' ) > SHA256SUMS
          sha256sum vpp-api-json.tar.gz >> SHA256SUMS
          cat manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: vpp-${{ needs.resolve.outputs.ref }}-${{ needs.resolve.outputs.platform }}-bullseye-arm64
          path: |
            /out/debs/*.deb
            /out/vpp-api-json.tar.gz
            /out/manifest.json
            /out/SHA256SUMS
          retention-days: 14

  verify-package:
    name: Verify installed package (clean bullseye)
    needs: [resolve, build]
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye
    defaults:
      run:
        shell: bash
    steps:
      # Deliberately a FRESH container with no build dependencies: the
      # question this job answers is "does what we publish install and
      # run on a stock fleet box", which the build tree cannot answer.
      - name: Bootstrap
        shell: sh
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates binutils

      - uses: actions/download-artifact@v4
        with:
          name: vpp-${{ needs.resolve.outputs.ref }}-${{ needs.resolve.outputs.platform }}-bullseye-arm64
          path: /pkg

      - name: Install the built packages
        run: |
          set -euo pipefail
          find /pkg -type f | sort
          # The .debs sit under /pkg/debs/: upload-artifact roots the
          # artifact at the least common ancestor of its path patterns
          # (/out), so the debs/ component survives the round trip. A
          # bare /pkg/*.deb glob matches nothing and, unexpanded, gets
          # handed to apt as a literal filename. Locate them instead —
          # this job had never actually run before, so the shape of the
          # download was assumption, not observation.
          mapfile -t debs < <(find /pkg -name '*.deb' | sort)
          [ "${#debs[@]}" -gt 0 ] || { echo "::error::no .deb in the artifact"; exit 1; }
          printf 'installing: %s\n' "${debs[@]}"
          # `apt-get install ./*.deb` (not `dpkg -i`) so unmet
          # dependencies fail loudly here rather than on a router.
          DEBIAN_FRONTEND=noninteractive apt-get install -y "${debs[@]}"
          command -v vpp || { echo "::error::no vpp on PATH after install"; exit 1; }

      - name: Verify the INSTALLED binary
        run: |
          set -euo pipefail
          vpp_bin=$(command -v vpp)
          echo "installed at: $vpp_bin"

          # The check that killed the fd.io deb, now applied to what we
          # actually ship rather than to a staging tree.
          floor=$(objdump -T "$vpp_bin" | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "glibc symbol floor: ${floor:-none}"
          if [ "$(echo "${floor:-GLIBC_2.0}" | cut -d. -f2)" -gt 31 ]; then
            echo "::error::installed binary requires $floor but UniFi OS ships glibc 2.31"
            exit 1
          fi

          # No unresolved libraries with only the package's own
          # dependencies installed.
          if ldd "$vpp_bin" | grep -q 'not found'; then
            echo "::error::unresolved shared libraries after install:"
            ldd "$vpp_bin" | grep 'not found'
            exit 1
          fi

          # The NIC driver must survive packaging, not merely exist in
          # the build tree. Same three shapes the build-tree smoke test
          # accepts — VPP's native dev_octeon, a standalone DPDK PMD, or
          # one linked into dpdk_plugin.so — because which one this VPP
          # ships is a property of the release, not a constant.
          native=$(find / -name 'dev_octeon*.so*' -not -path '/proc/*' -print -quit 2>/dev/null || true)
          pmd_so=$(find / \( -name 'librte_net_cnxk*' -o -name 'librte_net_octeontx2*' \) \
            -not -path '/proc/*' -print -quit 2>/dev/null || true)
          plugin=$(find / -name dpdk_plugin.so -not -path '/proc/*' -print -quit 2>/dev/null || true)
          if [ -n "$native" ]; then
            echo "installed native Octeon driver: $native"
          elif [ -n "$pmd_so" ]; then
            echo "installed standalone PMD: $pmd_so"
          elif [ -n "$plugin" ] && strings "$plugin" | grep -qE 'net_cnxk|net_octeontx2'; then
            echo "installed PMD linked into: $plugin"
          else
            echo "::error::the installed packages carry no Octeon driver (native or DPDK)"
            exit 1
          fi
          echo "installed package verified: loads, resolves, and carries an Octeon driver"

  # Publishing is a SEPARATE job gated on verify-package, not a final
  # step of `build`. It used to be the latter, which meant the .debs
  # were downloadable before anything had tried installing them: a
  # package that failed verification was already on the release page,
  # and the runbook told operators that a published artifact had been
  # verified. Ordering, not wording, is what makes that true.
  publish:
    name: Publish release
    needs: [resolve, build, verify-package]
    # A push-triggered run leaves `inputs.publish` empty, which coerces
    # equal to `false` — so the PRIMARY automatic trigger would spend
    # the whole build and publish nothing, leaving the runbook's
    # release pointer dangling. Gate on the event.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vpp-${{ needs.resolve.outputs.ref }}-${{ needs.resolve.outputs.platform }}-bullseye-arm64
          path: /tmp/pkg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/pkg
          find . -type f | sort
          # Facts come from the manifest the build wrote, not from job
          # env: this job runs on a different runner, and re-deriving
          # them here would let the release notes disagree with the
          # artifact they describe.
          commit=$(jq -r '.vpp_commit' manifest.json)
          pmd=$(jq -r '.octeon_pmd' manifest.json)
          tag='${{ needs.resolve.outputs.tag }}'
          notes=$(printf '%s\n' \
            "Unmodified upstream VPP \`${{ needs.resolve.outputs.ref }}\` (\`$commit\`), built for Debian 11 (bullseye) arm64 — the only combination UniFi OS can install." \
            "" \
            "Variant: \`${{ needs.resolve.outputs.platform }}\` · Octeon PMD: \`$pmd\` · No patches applied." \
            "" \
            "Verified in CI before publication: glibc symbol floor ≤ 2.31, no unresolved shared libraries, Octeon PMD present, and the .debs install cleanly into a stock bullseye." \
            "" \
            "\`vpp-api-json.tar.gz\` is the API-definition bundle consumed by the vpp-offload binary-API codegen; it is published separately so codegen does not download the .debs." \
            "" \
            "Install order and operational guidance: \`docs/runbooks/vpp-offload-spike.md\`.")
          title="VPP ${{ needs.resolve.outputs.ref }} (${{ needs.resolve.outputs.platform }}, bullseye/arm64)"
          # Flat asset names, matching SHA256SUMS — see the manifest
          # step's note on why that matters after a download.
          #
          # The tag can already exist: resolve rebuilds when the build
          # workflow itself changed, since the artifact depends on this
          # file's config and not on the pin alone. Update in place
          # (`--clobber`) rather than delete-and-recreate, so there is
          # no window where the release the runbook points operators at
          # does not exist.
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "::notice::$tag exists — replacing its assets"
            gh release edit "$tag" --repo '${{ github.repository }}' \
              --title "$title" --notes "$notes"
            gh release upload "$tag" --repo '${{ github.repository }}' --clobber \
              debs/*.deb vpp-api-json.tar.gz manifest.json SHA256SUMS
          else
            gh release create "$tag" \
              --repo '${{ github.repository }}' \
              --title "$title" \
              --notes "$notes" \
              debs/*.deb vpp-api-json.tar.gz manifest.json SHA256SUMS
          fi
          echo "::notice::published $tag"

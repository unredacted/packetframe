# PacketFrame example config.
#
# Interface names, VLAN IDs, and prefixes in this file are illustrative.
# They will not apply verbatim to any other host; substitute your own.
#
# The grammar is line-based. Unknown directives are fatal; every interface
# named in an `attach` directive must exist at startup.

global
  metrics-textfile /var/lib/node_exporter/textfile/packetframe.prom
  log-level info
  bpffs-root /sys/fs/bpf/packetframe
  state-dir /var/lib/packetframe/state

  # Pause between per-iface attaches so each link settles before the
  # next attach touches the driver. On some drivers XDP attach briefly
  # bounces the link; if multiple attach ifaces share a bridge master,
  # bouncing two ports inside one STP reconvergence window has been
  # observed to trigger L2 loops. 0s disables; recommended >=2s
  # whenever multiple ifaces share a bridge.
  attach-settle-time 2s

module fast-path
  # Attach native XDP to every interface carrying forwarded traffic we want
  # on the fast path. Omit HA links, out-of-band management, and anything
  # terminating tunnels locally.
  #
  # Modes: native | generic | auto | tc.
  # `tc` (Phase T) runs the datapath as sched_cls classifiers on a
  # clsact qdisc instead of XDP. On hosts forced into xdp-generic
  # (e.g. rvu-nicpf kernels < 6.8) it avoids generic XDP's per-packet
  # headroom copy and GRO linearization. Requires `forwarding-mode
  # custom-fib`; per-iface opt-in (never chosen by `auto`) so canary
  # rollouts stay operator-controlled, e.g.:
  #   attach eth5 tc
  attach eth0 native
  attach eth2 native
  attach eth3 native
  attach eth4 native
  attach eth5 native

  # Allowlist: matches if src OR dst falls in any prefix.
  # Asymmetric (dst-only) would leave reply traffic on conntrack.
  allow-prefix  23.191.200.0/24
  allow-prefix6 2001:db8::/48

  # Dry-run mode: program counts but does not redirect. Live-updatable
  # via `packetframe reconfigure`.
  dry-run on

  # Circuit breaker: denominator is matched traffic, not rx_total.
  # Trips when drop_unreachable + err_fib_other exceeds 1% of matched
  # over 5 consecutive 5-second samples.
  circuit-breaker drop-ratio 0.01 of matched window 5s threshold 5

  # MSS clamping for fast-pathed TCP SYN/SYN-ACK packets (v0.2.4+).
  # Closes the iptables-bypass MSS gap: standard iptables
  # `-A FORWARD ... TCPMSS --set-mss N` rules don't fire on
  # XDP-redirected traffic because bpf_redirect_map skips netfilter,
  # so this directive runs the equivalent mutation inline before the
  # redirect.
  #
  # Lookup precedence (most specific wins, lower-if-higher policy):
  #   1. mss-clamp <cidr> via <iface> <mtu>   (prefix + egress iface)
  #   2. mss-clamp <cidr> <mtu>                (prefix, any egress)
  #   3. mss-clamp via <iface> <mtu>           (egress iface, any prefix)
  #   4. mss-clamp <mtu>                       (global default)
  #
  # Prefix matches src OR dst (mirrors allow-prefix semantics) so a
  # single rule covers both directions of a flow. Clamped on both SYN
  # and SYN-ACK so each end's announced MSS is constrained per-direction.
  # See docs/runbooks/mss-clamp.md for MSS vs MTU math + troubleshooting.
  #
  # mss-clamp via eth2 1360                  # outbound: leaving WAN
  # mss-clamp 23.191.201.0/24 via eth2 1360  # outbound, scoped to one customer
  # mss-clamp 1360                           # global fallback for all matched

  # Driver workaround for the pre-Linux-v6.8 rvu-nicpf native XDP bug
  # (upstream fix is commit 04f647c8e456). Values:
  #   auto:  detect rvu-nicpf via /sys and apply only on native attaches
  #          (default; safe across driver families).
  #   on:    force-apply regardless of driver.
  #   off:   never apply (set this after upgrading to Linux v6.8+ or a
  #          kernel with the fix backported).
  # driver-workaround rvu-nicpf-head-shift auto

  # Bridge egress short-circuit. When a nexthop's egress device is a
  # Linux bridge whose single forwarding member is a VLAN subif
  # (br1337 -> switch0.1337 -> switch0, the UniFi gateway shape), the
  # loader installs a VLAN_RESOLVE entry keyed on the bridge ifindex
  # so forwarded packets are tagged and redirected straight to the
  # underlying device, skipping the software bridge traversal (and
  # its ebtables walk). The wire frame is identical to what the
  # bridge would emit. Multi-member bridges never qualify. Values:
  #   auto:  (default) install wherever sysfs proves the shape.
  #   on:    synonym for auto (nothing to force; unprovable
  #          topologies stay on the kernel path).
  #   off:   never install — the SIGHUP-able rollback.
  # Assumes 802.1Q (the datapath tags TPID 0x8100, as the whole
  # VLAN_RESOLVE mechanism does); 802.1ad deployments should set off.
  # An `mss-clamp via <bridge>` rule will not match while a bridge is
  # collapsed — scope it via the underlying device instead (warned at
  # attach). Bridges with MTU below their underlying device never
  # qualify.
  # bridge-resolve auto

  # Destination cache in front of the custom-FIB LPM lookups
  # (EXPERIMENT, default off). A full BGP table makes each LPM lookup
  # a deep DRAM-bound trie walk; the cache converts repeat
  # destinations into one per-CPU array probe. Cached entries hold the
  # FIB decision (not the resolved neighbor), so nexthop churn needs no
  # invalidation and ECMP flow placement is unchanged; any route change
  # invalidates the whole cache via a generation counter. Only
  # meaningful under `forwarding-mode custom-fib`. Enable on a canary
  # and decide by measurement: fib_cache_hit / (hit+miss+stale) below
  # ~70% means your destination diversity defeats the cache — leave it
  # off. SIGHUP-reloadable.
  # fib-cache off

  # FDB-pinned direct-to-port egress (v0.2.9, default auto). Extends
  # the bridge short-circuit one hop further when the short-circuited
  # chain's underlying device is itself a multi-member bridge: the
  # resolver consults that bridge's FDB per nexthop MAC and pins the
  # nexthop straight to the member port + VID, skipping the bridge
  # transmit path (FDB lookup, ebtables, egress qdisc, AF_PACKET tap
  # walk). Pins follow AF_BRIDGE FDB events live (MAC move, age-out)
  # and fall back to the bridge path whenever the FDB has no answer.
  # Requires bridge-resolve active; restart-only (attach-time-bound).
  # DEFAULT OFF (unlike bridge-resolve): the short-circuit reasons from
  # static sysfs topology, but pinning depends on LIVE bridge learning
  # (MAC moves, age-out, dump/watch ordering), so it needs an explicit
  # opt-in until it has soaked on hardware. `auto` means off; only `on`
  # arms it. Disabled automatically under forwarding-mode compare
  # (pinned egress would read as CompareDisagree and corrupt the
  # validation metrics) and inert under kernel-fib.
  # fdb-pin on

  # --- Option F custom FIB. Cutting over to `custom-fib` requires
  # bird's BMP protocol dialing this station AND bird's kernel
  # export dropping BGP routes. See docs/runbooks/custom-fib.md for
  # the full cutover sequence and rollback procedure. Do not flip
  # this in production without validating on staging first.

  # Forwarding path selector. Values:
  #   kernel-fib: (default) use bpf_fib_lookup() against the kernel
  #               FIB. Today's behavior; the permanent rollback
  #               option.
  #   custom-fib: consult the module's own LPM-trie FIB populated
  #               from BMP. Requires `route-source bmp ...`.
  #   compare:    run both lookups, forward via kernel result, bump
  #               disagreement counters. Pre-cutover validation
  #               mode; expect 2× the per-packet FIB cost. Temporary.
  # forwarding-mode kernel-fib

  # Route-source feed for the custom FIB. Pick exactly one when
  # forwarding-mode is `custom-fib` or `compare`. Two kinds:
  #
  #   bgp <addr>:<port> local-as <asn> peer-as <asn> [router-id <ipv4>]
  #     iBGP listener. Bird dials in via `protocol bgp packetframe
  #     { neighbor <addr> port <port> as <asn>; ... }`. Bird's
  #     export filter runs after best-path so we get bird's selected
  #     paths verbatim. Recommended for production today (bird 2.x /
  #     3.x master don't ship RFC 9069 Loc-RIB BMP).
  #
  #   bmp <addr>:<port> [require-loc-rib]
  #     BMP station. Only safe to drive forwarding from if the
  #     emitter sends RFC 9069 Loc-RIB peer_type=3 frames (FRR has
  #     this; bird 2.x/3.x does not). The `require-loc-rib` flag
  #     hard-rejects pre/post-policy frames so misconfiguration
  #     fails loudly instead of silent wrong-forwarding.
  #
  # **Listener authorization.** The listener has no protocol-level
  # auth (no TCP-MD5 / TCP-AO wiring yet). The safe default is a
  # loopback bind: bird and packetframe must run on the same host
  # and the iBGP session lives on `127.0.0.1` (or `::1`). For that
  # topology, no extra keywords are needed.
  #
  # Binding a non-loopback address is rejected at config-load unless
  # the operator opts in with `allow-remote` AND declares a CIDR ACL
  # via one or more `peer-from <cidr>` entries. The ACL is enforced
  # at `accept()` time before any BGP/BMP framing runs, so peers
  # outside the declared sources are dropped at TCP. The BGP variant
  # additionally accepts `peer-ip <ip>` to pin the configured
  # `peer-as` to a specific source address; the OPEN's effective
  # peer-ASN (RFC 6793 four-octet capability when present, else the
  # 2-byte field) must equal `peer-as` or the session is closed.
  #
  # route-source bgp 127.0.0.1:1179 local-as 401401 peer-as 401401 router-id 103.17.154.7
  # route-source bmp 127.0.0.1:6543 require-loc-rib
  #
  # Non-loopback example (only if the listener is reachable solely
  # inside a private network, e.g. a netns or VPC the operator owns):
  # route-source bgp 10.0.0.1:1179 local-as 401401 peer-as 401401 \
  #   allow-remote peer-from 10.0.0.0/24 peer-ip 10.0.0.5

  # ECMP default hash mode (3/4/5-tuple). Applied globally today;
  # per-group overrides could come later if bird ever surfaces a
  # hint via BMP. Rarely needs changing from the default 5.
  # ecmp-default-hash-mode 5

  # Custom-FIB map sizes. **Parsed but not yet runtime-applied.**
  # aya and the kernel allocate BPF maps at compile-time sizes baked
  # into the BPF program. Changing these in the config has no effect
  # until the BPF ELF is rebuilt with the matching constant.
  # Defaults (2²¹ v4 / 2²⁰ v6) comfortably cover the current DFZ.
  # fib-v4-max-entries 2097152
  # fib-v6-max-entries 1048576
  # nexthops-max-entries 8192
  # ecmp-groups-max-entries 1024

  # Connected fast-path (v0.2.1+). Declare connected/local prefixes
  # that bird sees as `direct1`-origin, the ones under `birdc show
  # route protocol direct1`. Without these, custom-fib mode falls
  # through to kernel slow path for every inbound packet to a
  # connected destination because the iBGP-supplied NEXT_HOP for a
  # direct route is a self-IP that the neighbour resolver can't map
  # to a useful MAC.
  #
  # When declared, NetlinkNeighborResolver walks the kernel's ARP
  # table for hosts in <cidr> reachable via <iface>, and synthesizes
  # per-/32 RouteEvent::Add events into FibProgrammer with state=Resolved
  # and the host's real MAC. The /32 wins over the /24 in LPM, and
  # XDP redirects directly to the host. Recovers ~57pp of bypass for
  # matched_dst_only on a typical EFG. No-op when omitted.
  #
  # local-prefix 23.191.200.0/24 via br1337   # customer LAN
  # local-prefix 10.88.1.0/24    via br88     # Ceph internal network
  # local-prefix 10.10.1.0/24    via br0      # other internal LAN

  # Optional `arp-scavenge` tail flag (v0.2.1+): probe every host IP
  # in the prefix at startup so quiet LANs (storage networks where
  # hosts only do intra-/24 L2 traffic) populate the kernel ARP cache
  # and the per-/32 fast-path lights up. Capped at /22 (≤ 1024 hosts)
  # to avoid kernel ARP storms. Off by default.
  #
  # SAFETY (v0.2.2+): probes go ONLY on the operator-declared `via
  # <iface>`, never through kernel route lookup. ARP traffic cannot
  # escape that iface's L2 broadcast domain. **Do NOT declare
  # arp-scavenge on an IX-attached iface.** Broadcasting ARP onto
  # an IX violates IX ToS (MANRS, anti-DoS rules). For internal LANs
  # only (storage, management, customer LANs).
  # local-prefix 10.88.1.0/24 via br88 arp-scavenge

  # IPv6 form (`local-prefix6`). Same idea, resolved via NDP instead of
  # ARP: one /128 per neighbour the kernel knows, nexthop = the host
  # itself, so the /128 wins the FIB_V6 LPM walk over any covering
  # route from the BGP feed.
  #
  # Declare the /64 (or whatever is actually configured on the iface),
  # NOT the aggregate you announce to the world. The aggregate is a
  # null-routed static in bird and is not a connected prefix.
  #
  # Needs a matching `allow-prefix6` covering it: the allowlist is
  # checked BEFORE the FIB lookup, so a /128 in FIB_V6 does nothing on
  # its own.
  #
  # There is deliberately no `arp-scavenge` equivalent. A /64 is not
  # enumerable, and SLAAC (RFC 4862) / stable-privacy (RFC 7217)
  # scatter host addresses across the full 64-bit interface identifier,
  # so a swept range would find almost no autoconfigured host. IPv6
  # relies on reactive seeding: the startup neighbour dump plus
  # RTM_NEWNEIGH, which already covers every host the kernel resolved.
  #
  # Multicast (ff00::/8), link-local (fe80::/10), ::/0, ::, ::1 and
  # IPv4-mapped prefixes are rejected at parse: none can be a
  # forwarded connected-host destination, and harvesting them would
  # burn NEXTHOPS slots (the kernel keeps NUD_NOARP neighbour entries
  # for multicast groups that look just like resolved unicast ones).
  # local-prefix6 2602:f7d8:0:1337::/64 via br1337

  # Synthetic IPv4 default route (v0.2.1, issue #31). Custom-FIB only
  # has the prefixes bird's iBGP feed advertised. For destinations
  # bird doesn't have specific routes for (RFC 1918, CGNAT,
  # test-net, anything outside DFZ), the LPM lookup misses and the
  # packet falls to slow path → eats a conntrack entry and gets
  # dropped upstream anyway. With `fallback-default`, the resolver
  # injects a /0 catch-all into the FIB; XDP redirects directly to
  # upstream instead. Same upstream behavior, just no kernel /
  # conntrack involvement. Recovers ~25% conntrack pressure on a
  # busy customer (Tor exit relay measured).
  #
  # `<iface>` must match the iface carrying default-route traffic
  # (typically the upstream/transit peer's iface). `<ipv4>` is the
  # peer's IP; it must already be a known kernel ARP entry (or be
  # one of the BGP nexthops the resolver already knows about).
  #
  # fallback-default via eth3 nexthop 194.110.60.50

  # XDP-time bogon block (v0.2.1, issue #33). When a packet's dst
  # falls in any `block-prefix` AND the packet is otherwise allowlist-
  # matched, the program returns XDP_DROP rather than XDP_PASS-to-
  # kernel. Drops bogon-bound traffic (RFC 1918, CGNAT, test-net) at
  # the earliest possible point. Saves the skb allocation, netfilter
  # walk, and conntrack capacity that would otherwise be burned on
  # packets that just get RST'd upstream anyway. Empty list = no
  # behavior change. Operator opts in.
  #
  # Refusing to start when a `block-prefix` overlaps an `allow-prefix`
  # or `local-prefix` (config bug, would silently drop traffic to
  # declared customer prefixes).
  #
  # block-prefix 10.0.0.0/8       # RFC 1918
  # block-prefix 172.16.0.0/12    # RFC 1918
  # block-prefix 192.168.0.0/16   # RFC 1918
  # block-prefix 100.64.0.0/10    # CGNAT (Tailscale, mobile carriers)
  # block-prefix 169.254.0.0/16   # link-local
  # block-prefix 192.0.2.0/24     # TEST-NET-1
  # block-prefix 198.51.100.0/24  # TEST-NET-2
  # block-prefix 203.0.113.0/24   # TEST-NET-3

# --- vpp-offload (phase 4, EXPERIMENTAL scaffold) --------------------------
# The VPP-on-VF forwarding vector: hardware-bifurcated allowlist traffic
# forwarded by a packetframe-supervised VPP on SR-IOV VFs, with the eBPF
# fast-path above as the permanent failover tier. Requires the fast-path
# section (steered prefixes inherit its allowlist, which must mean pure
# stateless L3 transit) and `forwarding-mode custom-fib` before any port
# steers. MEMBERSHIP IS ALL-OR-NOTHING: every fast-path attach port needs
# a `port` line before any `steer on` (a steered packet's best path may
# egress any port; missing members blackhole those destinations). `steer`
# is the per-port canary lever; all-members + all-steer-off is the safe
# staging state. See the phase-4 plan / vpp-offload runbook.
#
# module vpp-offload
#   port eth0 cores 1 steer off   # a member because the fast-path attaches
#   port eth2 cores 1 steer off   # it — NOT because BGP best-paths egress
#   port eth3 cores 1 steer off   # here. The measured table egresses via
#   port eth4 cores 1 steer off   # eth2/eth3 only; membership is still the
#   port eth5 cores 1 steer off   # whole attach set. Flip one to `on` to
#                                 # canary — which is why every attach port
#                                 # must already be listed above.
#   expected-routes 1600000       # v4+v6 DFZ + growth; drives memory sizing.
#                                 # Live table measured ~1.30M (2026-08-02);
#                                 # DFZ grows ~100k/yr, so this is ~3 years.
#   hugepages 10                  # >= derived minimum (checked at startup)
#   # vpp-binary /usr/bin/vpp

# Which published VPP artifact the vpp-offload module consumes.
#
# THIS FILE IS A CONSUMER RECORD, NOT A BUILD TRIGGER. The build lives
# in github.com/unredacted/vpp-unifi (one pin file per UniFi gateway
# target; the EFG's is pins/efg.toml, which also carries the full
# empirical record of why platform=octeon9 is mandatory on that
# hardware). It moved there because the build is a property of UniFi
# hardware, not of packetframe — this repo is one consumer of the
# published artifacts.
#
# What this file asserts: the release tag below —
# `vpp-<ref>-<platform>-bullseye-arm64` on the repo below — is the VPP
# that (a) the vendored API definitions under
# crates/modules/vpp-offload/vpp-api/ were extracted from, so the
# binary-API codegen generates against exactly this wire format, and
# (b) the runbooks and the hwtest bundle's vpp-pin.txt tell operators
# to install.
#
# Bumping VPP is therefore a TWO-REPO sequence, in order:
#   1. vpp-unifi: edit the gateway pin, merge; CI builds, verifies and
#      publishes the new tag (~45 min).
#   2. here: update ref/platform below, re-vendor vpp-api-json.tar.gz
#      from the new release into crates/modules/vpp-offload/vpp-api/,
#      re-run the codegen and commit the result. CI's
#      regenerate-and-diff job catches a wire-format change that this
#      step missed; the transport's CRC handshake catches a router
#      running a different VPP than this pin at attach time.
# No cross-version adoption: upgrading a router is detach -> install
# -> attach (see docs/runbooks/vpp-offload.md).

[vpp]
repo = "unredacted/vpp-unifi"
ref = "v26.06"
platform = "octeon9"

# /etc/systemd/system/docker.service.d/after-tailscale.conf
#
# Docker publishes the collectors on this host's Tailscale address, which
# must exist when the containers start: start after tailscaled, and wait
# up to 60 s for its IPv4 address. Docker starts anyway after that, and a
# collector whose address is missing fails until `docker compose up -d`.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do ip -4 addr show dev tailscale0 2>/dev/null | grep -q "inet " && exit 0; sleep 1; done; exit 0'

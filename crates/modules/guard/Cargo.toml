[package]
name = "packetframe-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PacketFrame guard module: tc-egress frame policer (ARP/NS per-target rate limit, LLDP drop, foreign-src-MAC drop)"
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
packetframe-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true

# aya (userspace) is Linux-only; the lifecycle implementation is
# cfg-gated accordingly. Non-Linux builds (macOS dev) compile without
# aya and have `attach`/`reconfigure` return NotImplemented.
[target.'cfg(target_os = "linux")'.dependencies]
aya.workspace = true
# health's read-only tc filter dump (aya's own finder is crate-private).
# The same message crates vpp-offload's blocking dumps use.
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys = "0.9"

[target.'cfg(target_os = "linux")'.dev-dependencies]
aya.workspace = true

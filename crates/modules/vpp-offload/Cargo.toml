[package]
name = "packetframe-vpp-offload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PacketFrame vpp-offload module: VPP-on-VF forwarding vector orchestrator (phase 4)"

[dependencies]
packetframe-common = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Unconditional, as in `common` and `cli`: most of the syscall surface
# here is Linux-only, but `bringup`'s executability check runs on the
# macOS dev loop too, and one implementation of it beats a cfg-split pair
# that can disagree.
libc = { workspace = true }

# B3 v1's bridge-FDB tripwire: one blocking AF_BRIDGE dump per minute.
# The same message crates fast-path's resolver decodes with, minus
# rtnetlink — this crate has no async runtime to park a connection on.
[target.'cfg(target_os = "linux")'.dependencies]
# The VPP sampler's directory (flow export): its tmpfs is mounted here
# before VPP starts, sized for the plugin's epochs.
packetframe-sampler-shm = { workspace = true }
packetframe-sampler-core = { workspace = true }
netlink-packet-core = { workspace = true }
netlink-packet-route = { workspace = true }
netlink-sys = "0.9"
